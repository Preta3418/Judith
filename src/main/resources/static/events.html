<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공연 관리 — Judith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="dash-shell">

    <nav class="dash-nav">
        <div class="dash-nav-inner">
            <a href="/" class="dash-logo">
                <img src="/images/logo-symbol-light.png" alt="Judith">
                <span class="dash-logo-text">Judith</span>
            </a>
            <div class="dash-nav-tabs" id="navTabs">
                <a href="/dashboard/index.html" class="dash-tab">홈</a>
                <a href="/dashboard/announcements.html" class="dash-tab">공지사항</a>
                <a href="/dashboard/scripts.html" class="dash-tab">대본</a>
                <a href="/dashboard/schedule.html" class="dash-tab">일정</a>
                <span class="dash-tab-divider">|</span>
                <a href="/users.html" class="dash-tab">부원</a>
                <a href="/seasons.html" class="dash-tab">시즌</a>
                <a href="/events.html" class="dash-tab active">공연</a>
                <a href="/messages.html" class="dash-tab">문자</a>
            </div>
            <div class="dash-nav-right">
                <button class="dash-season-btn" id="seasonSelector" style="display:none;"></button>
                <div class="dash-avatar" id="userAvatar">U</div>
                <span class="dash-user-name" id="userName"></span>
                <button class="dash-btn-logout" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </nav>

    <main class="dash-main" id="pageContainer">
        <div class="loading"><div class="spinner"></div></div>
    </main>
</div>

<!-- Add Schedule Modal -->
<div class="modal-overlay" id="addScheduleModal">
    <div class="modal" style="max-width:400px;">
        <div class="modal-header">
            <h3 class="modal-title">일정 추가</h3>
            <button class="modal-close" onclick="closeModal('addScheduleModal')">&times;</button>
        </div>
        <div class="modal-body">
            <form id="addScheduleForm" onsubmit="submitAddSchedule(event)">
                <div class="form-group">
                    <label class="form-label required">공연 일시</label>
                    <input type="datetime-local" class="form-input" id="scheduleDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">예약 마감일</label>
                    <input type="datetime-local" class="form-input" id="scheduleDeadline" required>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('addScheduleModal')">취소</button>
            <button class="btn btn-primary" onclick="document.getElementById('addScheduleForm').requestSubmit()">추가</button>
        </div>
    </div>
</div>

<!-- Reservations Modal -->
<div class="modal-overlay" id="reservationsModal">
    <div class="modal" style="max-width:600px;">
        <div class="modal-header">
            <h3 class="modal-title" id="reservationsTitle">예매 목록</h3>
            <button class="modal-close" onclick="closeModal('reservationsModal')">&times;</button>
        </div>
        <div class="modal-body" id="reservationsBody"></div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
if (!requireAuth()) { /* redirects */ }
if (!isAdmin()) { window.location.href = '/dashboard/index.html'; }

const _sid = sessionStorage.getItem('judithSeasonId');
if (_sid) {
    document.querySelectorAll('.dash-nav-tabs a[href^="/dashboard/"]').forEach(a => {
        try { const u = new URL(a.href); u.searchParams.set('seasonId', _sid); a.href = u.toString(); } catch(e) {}
    });
}

const _uname = getCurrentUserName();
document.getElementById('userName').textContent = _uname;
document.getElementById('userAvatar').textContent = _uname.charAt(0).toUpperCase();
checkPasswordChangeNeeded();

// ==================== State ====================
let currentSeason = null;
let currentEvent = null;

// ==================== Init ====================
async function init() {
    // Season selector
    try {
        const s = await seasonApi.getCurrent();
        const btn = document.getElementById('seasonSelector');
        if (btn && s) {
            btn.textContent = s.name;
            btn.style.display = '';
            btn.onclick = () => window.location.href = '/dashboard/index.html';
        }
    } catch(e) {}

    try {
        currentSeason = await seasonApi.getCurrent();
    } catch(e) { currentSeason = null; }

    if (currentSeason && currentSeason.id) {
        const event = await eventApi.getBySeasonId(currentSeason.id);
        if (event) {
            currentEvent = event;
            renderEvent(false);
        } else {
            renderCreateForm();
        }
        return;
    }

    // No active season — try to show last closed season's event in read-only mode
    try {
        const allSeasons = await seasonApi.getAll();
        const closed = allSeasons.filter(s => s.status === 'CLOSED').sort((a, b) => b.id - a.id);
        if (closed.length > 0) {
            currentSeason = closed[0];
            const event = await eventApi.getBySeasonId(currentSeason.id);
            if (event) {
                currentEvent = event;
                renderEvent(true);
                return;
            }
        }
    } catch(e) {}

    renderNoSeason();
}

// ==================== Views ====================
function renderNoSeason() {
    document.getElementById('pageContainer').innerHTML = `
        <div class="dash-page-header">
            <div class="dash-greeting">공연 관리</div>
            <div class="dash-subtitle">활성 시즌이 없습니다</div>
        </div>
        <div class="dash-card" style="text-align:center;padding:48px 24px;">
            <div style="font-size:2.5rem;margin-bottom:16px;">🎭</div>
            <p style="color:var(--text-muted);margin-bottom:20px;">공연을 등록하려면 먼저 시즌을 활성화해주세요.</p>
            <a href="/seasons.html" class="btn btn-primary">시즌 관리</a>
        </div>
    `;
}

function renderCreateForm() {
    document.getElementById('pageContainer').innerHTML = `
        <div class="dash-page-header">
            <div class="dash-greeting">공연 관리</div>
            <div class="dash-subtitle">${escHtml(currentSeason.name)} — 등록된 공연 없음</div>
        </div>
        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">새 공연 등록</span>
            </div>
            <div class="form-group">
                <label class="form-label required">공연 제목</label>
                <input type="text" class="form-input" id="createTitle" placeholder="예: 2026 봄 정기공연">
            </div>
            <div class="form-group">
                <label class="form-label required">설명</label>
                <textarea class="form-textarea" id="createDesc" rows="4" placeholder="공연 소개 및 내용"></textarea>
            </div>
            <div style="display:flex;gap:16px;">
                <div class="form-group" style="flex:1;">
                    <label class="form-label required">장소</label>
                    <input type="text" class="form-input" id="createLocation" placeholder="예: 홍익대학교 대학로 아트센터">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label required">총 좌석 수</label>
                    <input type="number" class="form-input" id="createCapacity" min="1" placeholder="100">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">초기 상태</label>
                <select class="form-input" id="createStatus">
                    <option value="CLOSED">예매 미시작</option>
                    <option value="OPEN">예매 시작</option>
                </select>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:24px;">
                <button class="btn btn-primary" onclick="submitCreate()">공연 등록</button>
            </div>
        </div>
    `;
}

function renderEvent(readOnly = false) {
    const STATUS = {
        OPEN:      { label: '예매중',    cls: 'badge-success' },
        CLOSED:    { label: '예매 전',   cls: 'badge-warning' },
        COMPLETED: { label: '공연 완료', cls: 'badge-secondary' }
    };
    const s = STATUS[currentEvent.status] || { label: currentEvent.status, cls: 'badge-secondary' };

    const actionBtn = currentEvent.status === 'OPEN'
        ? `<button class="btn btn-secondary" onclick="closeCurrentEvent()">예매 마감</button>`
        : currentEvent.status === 'CLOSED'
        ? `<button class="btn btn-success" onclick="openCurrentEvent()">예매 시작</button>`
        : '';

    document.getElementById('pageContainer').innerHTML = `
        <div class="dash-page-header">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;">
                <div>
                    <div class="dash-greeting">${escHtml(currentEvent.title)}</div>
                    <div class="dash-subtitle" style="display:flex;align-items:center;gap:8px;margin-top:4px;">
                        ${escHtml(currentSeason.name)}
                        <span class="badge ${s.cls}">${s.label}</span>
                    </div>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                    ${actionBtn}
                    <button class="btn btn-ghost" style="color:var(--danger);" onclick="deleteCurrentEvent()">삭제</button>
                </div>
            </div>
        </div>

        <!-- 기본 정보 -->
        <div class="dash-card">
            <div class="dash-card-header"><span class="dash-card-title">기본 정보</span></div>
            <div class="form-group">
                <label class="form-label required">공연 제목</label>
                <input type="text" class="form-input" id="editTitle" value="${escHtml(currentEvent.title)}">
            </div>
            <div class="form-group">
                <label class="form-label required">설명</label>
                <textarea class="form-textarea" id="editDesc" rows="4">${escHtml(currentEvent.description)}</textarea>
            </div>
            <div style="display:flex;gap:16px;">
                <div class="form-group" style="flex:1;">
                    <label class="form-label required">장소</label>
                    <input type="text" class="form-input" id="editLocation" value="${escHtml(currentEvent.location)}">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label required">총 좌석 수</label>
                    <input type="number" class="form-input" id="editCapacity" value="${currentEvent.capacityLimit}" min="1">
                </div>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:8px;">
                <button class="btn btn-primary" onclick="saveInfo()">저장</button>
            </div>
        </div>

        <!-- 포스터 -->
        <div class="dash-card">
            <div class="dash-card-header"><span class="dash-card-title">포스터</span></div>
            ${currentEvent.posterImageUrl
                ? `<img src="${currentEvent.posterImageUrl}" alt="포스터" style="max-height:220px;border-radius:var(--radius);margin-bottom:12px;display:block;">`
                : '<p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:12px;">등록된 포스터가 없습니다.</p>'}
            <div style="display:flex;align-items:center;gap:12px;">
                <input type="file" id="posterFile" accept="image/*" style="display:none" onchange="uploadPosterFile()">
                <button class="btn btn-outline" id="posterBtn" onclick="document.getElementById('posterFile').click()">
                    ${currentEvent.posterImageUrl ? '포스터 교체' : '포스터 업로드'}
                </button>
                <span id="posterStatus" style="font-size:0.82rem;color:var(--text-muted);"></span>
            </div>
        </div>

        <!-- 공연 일정 -->
        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">공연 일정</span>
                <button class="btn btn-sm btn-outline" onclick="openModal('addScheduleModal')">+ 일정 추가</button>
            </div>
            <div id="scheduleList">${renderScheduleList()}</div>
        </div>

        <!-- 공개 예매 링크 -->
        <div class="dash-card">
            <div class="dash-card-header"><span class="dash-card-title">공개 예매 링크</span></div>
            <div style="display:flex;gap:8px;">
                <input type="text" class="form-input" id="publicUrl" readonly
                    value="${window.location.origin}/public/book.html?id=${currentEvent.id}"
                    style="background:var(--gray-50);">
                <button class="btn btn-outline" onclick="copyUrl()">복사</button>
            </div>
            <div class="form-hint" style="margin-top:6px;">이 링크를 공유하면 누구나 예매할 수 있습니다.</div>
        </div>

        <!-- 팸플릿 -->
        <div class="dash-card">
            <div class="dash-card-header"><span class="dash-card-title">팸플릿 PDF</span></div>
            ${currentEvent.pamphletUrl ? `
                <div style="display:flex;align-items:center;gap:8px;background:var(--gray-50);border:1px solid var(--border-light);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--primary);flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <a href="${currentEvent.pamphletUrl}" target="_blank" class="text-primary" style="font-size:0.85rem;flex:1;">팸플릿 보기</a>
                    <a href="/public/pamphlet.html?id=${currentEvent.id}" target="_blank" class="btn btn-sm btn-ghost">미리보기</a>
                </div>` : ''}
            <div style="display:flex;align-items:center;gap:12px;">
                <input type="file" id="pamphletFile" accept="application/pdf" style="display:none" onchange="uploadPamphletFile()">
                <button class="btn btn-outline" id="pamphletBtn" onclick="document.getElementById('pamphletFile').click()">
                    ${currentEvent.pamphletUrl ? 'PDF 교체' : 'PDF 업로드'}
                </button>
                <span id="pamphletStatus" style="font-size:0.82rem;color:var(--text-muted);"></span>
            </div>
            <div class="form-hint" style="margin-top:6px;">업로드 후 팸플릿 페이지에서 확인할 수 있습니다.</div>
        </div>

        <!-- 출연진 -->
        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">출연진 및 스태프</span>
                <a href="/seasons.html" class="btn btn-sm btn-ghost" style="color:var(--primary);">시즌 관리에서 편집</a>
            </div>
            <div id="castingSection"><div class="spinner" style="width:20px;height:20px;"></div></div>
        </div>
    `;

    loadCasting();

    if (readOnly) {
        // Insert closed-season banner at the top of pageContainer
        document.getElementById('pageContainer').insertAdjacentHTML('afterbegin', `
            <div style="background:var(--warning-bg,#fff8e1);border:1px solid var(--warning,#f59e0b);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.1rem;">🔒</span>
                <span style="font-weight:500;color:var(--text-primary);">종료된 학기입니다 — 조회만 가능합니다</span>
            </div>
        `);
        // Disable all form inputs and buttons (except view-only ones)
        document.querySelectorAll('#pageContainer input, #pageContainer textarea, #pageContainer select').forEach(el => {
            el.disabled = true;
            el.style.opacity = '0.6';
        });
        document.querySelectorAll('#pageContainer button').forEach(btn => {
            // Keep reservation view buttons usable
            if (!btn.textContent.includes('예매 목록')) {
                btn.disabled = true;
                btn.style.opacity = '0.4';
                btn.style.pointerEvents = 'none';
            }
        });
    }
}

function renderScheduleList() {
    if (!currentEvent.schedules || currentEvent.schedules.length === 0) {
        return '<p style="color:var(--text-muted);font-size:0.875rem;">등록된 일정이 없습니다.</p>';
    }
    return currentEvent.schedules.map(s => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);">
            <div>
                <div style="font-weight:500;">${fmtDT(s.eventDate)}</div>
                <div style="font-size:0.8rem;color:var(--text-muted);">
                    예약 마감 ${fmtDT(s.registrationDeadLine)} &middot; 잔여 ${s.remainingSeats}석
                </div>
            </div>
            <button class="btn btn-sm btn-ghost" onclick="viewReservations(${s.eventScheduleId})">예매 목록</button>
        </div>
    `).join('');
}

// ==================== Create ====================
async function submitCreate() {
    const title    = document.getElementById('createTitle').value.trim();
    const desc     = document.getElementById('createDesc').value.trim();
    const location = document.getElementById('createLocation').value.trim();
    const capacity = document.getElementById('createCapacity').value;
    const status   = document.getElementById('createStatus').value;

    if (!title || !desc || !location || !capacity) {
        showToast('모든 필수 항목을 입력해주세요', 'error');
        return;
    }
    try {
        await eventApi.create({ title, description: desc, location, capacityLimit: parseInt(capacity), status });
        showToast('공연이 등록되었습니다', 'success');
        await refreshPage();
    } catch(e) {
        showToast('등록 실패: ' + e.message, 'error');
    }
}

// ==================== Edit basic info ====================
async function saveInfo() {
    const title    = document.getElementById('editTitle').value.trim();
    const desc     = document.getElementById('editDesc').value.trim();
    const location = document.getElementById('editLocation').value.trim();
    const capacity = document.getElementById('editCapacity').value;

    if (!title || !desc || !location || !capacity) {
        showToast('모든 필수 항목을 입력해주세요', 'error');
        return;
    }
    try {
        await eventApi.update(currentEvent.id, {
            title, description: desc, location,
            capacityLimit: parseInt(capacity),
            status: currentEvent.status,
            posterImageUrl: currentEvent.posterImageUrl
        });
        showToast('저장되었습니다', 'success');
        await refreshPage();
    } catch(e) {
        showToast('저장 실패: ' + e.message, 'error');
    }
}

// ==================== Status actions ====================
async function openCurrentEvent() {
    if (!confirm('예매를 시작하시겠습니까?')) return;
    try {
        await eventApi.update(currentEvent.id, {
            title: currentEvent.title, description: currentEvent.description,
            location: currentEvent.location, capacityLimit: currentEvent.capacityLimit,
            status: 'OPEN', posterImageUrl: currentEvent.posterImageUrl
        });
        showToast('예매가 시작되었습니다', 'success');
        await refreshPage();
    } catch(e) { showToast('실패: ' + e.message, 'error'); }
}

async function closeCurrentEvent() {
    if (!confirm('예매를 마감하시겠습니까? 공연이 완료 처리됩니다.')) return;
    try {
        await eventApi.closeEvent(currentEvent.id);
        showToast('예매가 마감되었습니다', 'success');
        await refreshPage();
    } catch(e) { showToast('실패: ' + e.message, 'error'); }
}

async function deleteCurrentEvent() {
    if (!confirm('공연을 삭제하시겠습니까? 모든 예매 정보도 함께 삭제됩니다.')) return;
    try {
        await eventApi.delete(currentEvent.id);
        showToast('공연이 삭제되었습니다', 'success');
        currentEvent = null;
        renderCreateForm();
    } catch(e) { showToast('삭제 실패: ' + e.message, 'error'); }
}

// ==================== Schedules ====================
async function submitAddSchedule(e) {
    e.preventDefault();
    try {
        await scheduleApi.create({
            eventId: currentEvent.id,
            eventDate: document.getElementById('scheduleDate').value,
            registrationDeadLine: document.getElementById('scheduleDeadline').value
        });
        showToast('일정이 추가되었습니다', 'success');
        closeModal('addScheduleModal');
        document.getElementById('addScheduleForm').reset();
        await refreshPage();
    } catch(e) { showToast('추가 실패: ' + e.message, 'error'); }
}

async function viewReservations(scheduleId) {
    try {
        const reservations = await scheduleApi.getReservations(scheduleId);
        document.getElementById('reservationsTitle').textContent = `예매 목록 (${reservations.length}건)`;
        document.getElementById('reservationsBody').innerHTML = reservations.length === 0
            ? '<p style="color:var(--text-muted);text-align:center;padding:24px;">예매 내역이 없습니다.</p>'
            : reservations.map(r => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-light);">
                    <div>
                        <div style="font-weight:500;">${escHtml(r.name)}</div>
                        <div style="font-size:0.82rem;color:var(--text-muted);">${formatPhone(r.phoneNumber)}</div>
                    </div>
                    <span style="font-size:0.875rem;">${r.ticketCount}명</span>
                </div>
            `).join('');
        openModal('reservationsModal');
    } catch(e) { showToast('예매 목록을 불러오지 못했습니다', 'error'); }
}

// ==================== Poster upload ====================
async function uploadPosterFile() {
    const file = document.getElementById('posterFile').files[0];
    if (!file) return;
    const status = document.getElementById('posterStatus');
    const btn    = document.getElementById('posterBtn');
    status.textContent = '업로드 중...';
    btn.disabled = true;
    try {
        const url = await uploadPoster(file, currentSeason.id);
        await eventApi.update(currentEvent.id, {
            title: currentEvent.title, description: currentEvent.description,
            location: currentEvent.location, capacityLimit: currentEvent.capacityLimit,
            status: currentEvent.status, posterImageUrl: url
        });
        showToast('포스터가 업로드되었습니다', 'success');
        await refreshPage();
    } catch(e) {
        status.textContent = '업로드 실패';
        btn.disabled = false;
        showToast('업로드 실패: ' + e.message, 'error');
    }
}

// ==================== Pamphlet upload ====================
async function uploadPamphletFile() {
    const file = document.getElementById('pamphletFile').files[0];
    if (!file) return;
    const status = document.getElementById('pamphletStatus');
    const btn    = document.getElementById('pamphletBtn');
    status.textContent = '업로드 중...';
    btn.disabled = true;
    try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('seasonId', currentSeason.id);
        const resp = await fetch(`/api/admin/events/${currentEvent.id}/pamphlet`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${getToken()}` },
            body: formData
        });
        if (!resp.ok) throw new Error('서버 오류');
        showToast('팸플릿이 업로드되었습니다', 'success');
        await refreshPage();
    } catch(e) {
        status.textContent = '업로드 실패';
        btn.disabled = false;
        showToast('팸플릿 업로드 실패: ' + e.message, 'error');
    }
}

// ==================== Casting ====================
async function loadCasting() {
    const container = document.getElementById('castingSection');
    if (!container) return;
    try {
        const users = await userSeasonApi.getUsersBySeason(currentSeason.id);
        if (!users || users.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted);font-size:0.875rem;">이 시즌에 배정된 부원이 없습니다.</p>';
            return;
        }
        const groups = {
            production: { title: '제작진', roles: ['LEADER','PRODUCER','SUB_PRODUCER','PLANNER'], members: [] },
            cast:       { title: '출연',   roles: ['ACTOR'], members: [] },
            design:     { title: '디자인', roles: ['SOUND_DESIGN','LIGHT_DESIGN','IMAGE_DESIGN','STAGE_DESIGN'], members: [] },
            tech:       { title: '기술',   roles: ['SOUND_OPERATOR','LIGHT_OPERATOR','STAFF'], members: [] }
        };
        users.forEach(user => {
            user.roles.forEach(role => {
                for (const g of Object.values(groups)) {
                    if (g.roles.includes(role) && !g.members.find(m => m.userId === user.userId && m.role === role)) {
                        g.members.push({ userId: user.userId, name: user.userName, role });
                    }
                }
            });
        });
        let html = '<div class="casting-admin-grid">';
        for (const g of Object.values(groups)) {
            if (!g.members.length) continue;
            html += `<div class="casting-admin-group">
                <div class="casting-admin-title">${g.title}</div>
                <div class="casting-admin-list">
                    ${g.members.map(m => `
                        <span class="casting-admin-member">
                            <span class="role-tag ${isFullAccessRole(m.role) ? 'full-access' : ''}">${getRoleLabel(m.role)}</span>
                            ${escHtml(m.name)}
                        </span>`).join('')}
                </div>
            </div>`;
        }
        html += '</div>';
        container.innerHTML = html;
    } catch(e) {
        container.innerHTML = '<p style="color:var(--text-muted);font-size:0.875rem;">출연진을 불러올 수 없습니다.</p>';
    }
}

// ==================== Helpers ====================
async function refreshPage() {
    const event = await eventApi.getBySeasonId(currentSeason.id);
    currentEvent = event;
    renderEvent(false);
}

function copyUrl() {
    const input = document.getElementById('publicUrl');
    input.select();
    navigator.clipboard.writeText(input.value)
        .then(() => showToast('링크가 복사되었습니다', 'success'))
        .catch(() => showToast('복사 실패', 'error'));
}

function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
}

function fmtDT(str) {
    if (!str) return '-';
    return new Date(str).toLocaleString('ko-KR', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

document.addEventListener('DOMContentLoaded', init);
</script>
