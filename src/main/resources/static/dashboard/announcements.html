<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 — JUDITH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="dash-shell">

    <nav class="dash-nav">
        <div class="dash-nav-inner">
            <a href="/" class="dash-logo">
                <img src="/images/logo-symbol-light.png" alt="JUDITH">
                <span class="dash-logo-text">JUDITH</span>
            </a>
            <div class="dash-nav-tabs" id="navTabs">
                <a href="/dashboard/index.html" class="dash-tab">홈</a>
                <a href="/dashboard/announcements.html" class="dash-tab active">공지사항</a>
                <a href="/dashboard/scripts.html" class="dash-tab">대본</a>
                <a href="/dashboard/schedule.html" class="dash-tab">일정</a>
                <a href="/dashboard/board-select.html" class="dash-tab">게시판</a>
            </div>
            <div class="dash-nav-right">
                <button class="dash-season-btn" id="seasonSelector"></button>
                <div class="dash-avatar" id="userAvatar">U</div>
                <span class="dash-user-name" id="userName"></span>
                <button class="dash-btn-logout" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </nav>

    <main class="dash-main" id="pageContainer">
        <div class="loading"><div class="spinner"></div></div>
    </main>

</div>

<!-- Create / Edit Announcement Modal -->
<div class="modal-overlay" id="notifModal">
    <div class="modal" style="max-width:500px;">
        <div class="modal-header">
            <h3 class="modal-title" id="notifModalTitle">공지사항 작성</h3>
            <button class="modal-close" onclick="closeNotifModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editingNotifId">
            <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" class="form-input" id="notifTitle" placeholder="공지 제목">
            </div>
            <div class="form-group">
                <label class="form-label">내용</label>
                <textarea class="form-input" id="notifContent" rows="6" placeholder="공지 내용" style="resize:vertical;"></textarea>
            </div>
            <div id="notifError" class="error-message" style="display:none;"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeNotifModal()">취소</button>
            <button class="btn btn-primary" id="notifSubmitBtn" onclick="submitNotification()">게시</button>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
<script>
let _canEdit = false;

async function loadPageContent() {
    _canEdit = currentSeason.myFullAccess;
    const isClosed = currentSeason.status === 'CLOSED';
    const container = document.getElementById('pageContainer');

    container.innerHTML = `
        <div class="dash-page-header">
            <div class="dash-greeting">공지사항</div>
            <div class="dash-subtitle">${escHtml(currentSeason.seasonName)}</div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;">
            ${(_canEdit && !isClosed) ? `<button class="btn btn-primary btn-sm" onclick="openCreateModal()">+ 공지 작성</button>` : ''}
        </div>

        <div class="dash-notifs" id="notifList">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    `;

    await loadAnnouncements();
}

async function loadAnnouncements() {
    const list = document.getElementById('notifList');
    try {
        const items = await api(`/api/dashboard/seasons/${currentSeasonId}/announcements`) || [];

        if (items.length === 0) {
            list.innerHTML = `<div class="dash-empty">
                <div class="dash-empty-icon">&#x1F4E2;</div>
                <p class="dash-empty-text">공지사항이 없습니다</p>
            </div>`;
            return;
        }

        list.innerHTML = items.map(n => {
            const isPinned = n.isPinned || n.pinned || false;
            const notifId = n.id || null;
            return `
            <div class="dash-notif ${n.read ? '' : 'unread'}" id="notif-${n.userNotificationId}">
                <div class="dash-notif-header" onclick="toggleNotif(${n.userNotificationId})" style="cursor:pointer;">
                    <div class="dash-notif-title-row" style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
                        ${n.read ? '' : '<span class="dash-unread-dot"></span>'}
                        ${isPinned ? `<span style="font-size:0.75rem;background:var(--primary-bg);color:var(--primary);padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0;">📌 고정</span>` : ''}
                        <span class="dash-notif-title">${escHtml(n.title)}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                        <span class="dash-notif-date">${fmtDateTime(n.createdAt)}</span>
                        ${_canEdit && notifId ? `
                        <button class="btn btn-ghost btn-sm" title="${isPinned ? '고정 해제' : '고정'}"
                            onclick="event.stopPropagation(); togglePin(${notifId}, ${isPinned})"
                            style="font-size:1rem;padding:2px 4px;color:${isPinned ? 'var(--primary)' : 'var(--text-muted)'};">📌</button>
                        <button class="btn btn-ghost btn-sm" title="수정"
                            onclick="event.stopPropagation(); openEditModal(${notifId}, ${JSON.stringify(n.title).replace(/'/g,"&#39;")}, ${JSON.stringify(n.content || '').replace(/'/g,"&#39;")})"
                            style="font-size:0.9rem;padding:2px 4px;">✏️</button>
                        <button class="btn btn-ghost btn-sm" title="삭제"
                            onclick="event.stopPropagation(); deleteAnnouncement(${notifId})"
                            style="font-size:0.9rem;padding:2px 4px;color:#ef4444;">🗑️</button>
                        ` : ''}
                    </div>
                </div>
                <div class="dash-notif-body">${escHtml(n.content)}</div>
            </div>
        `}).join('');
    } catch(e) {
        list.innerHTML = '<div class="alert alert-danger">공지사항을 불러올 수 없습니다.</div>';
    }
}

function toggleNotif(userNotifId) {
    const item = document.getElementById(`notif-${userNotifId}`);
    if (!item) return;
    const expanding = !item.classList.contains('expanded');
    item.classList.toggle('expanded', expanding);

    if (expanding && item.classList.contains('unread')) {
        api(`/api/notifications/${userNotifId}/read`, { method: 'POST' }).catch(() => {});
        item.classList.remove('unread');
        item.querySelector('.dash-unread-dot')?.remove();
    }
}

// ==================== Create / Edit ====================
function openCreateModal() {
    document.getElementById('editingNotifId').value = '';
    document.getElementById('notifModalTitle').textContent = '공지사항 작성';
    document.getElementById('notifSubmitBtn').textContent = '게시';
    document.getElementById('notifTitle').value = '';
    document.getElementById('notifContent').value = '';
    document.getElementById('notifError').style.display = 'none';
    openModal('notifModal');
}

function openEditModal(notifId, title, content) {
    document.getElementById('editingNotifId').value = notifId;
    document.getElementById('notifModalTitle').textContent = '공지사항 수정';
    document.getElementById('notifSubmitBtn').textContent = '저장';
    document.getElementById('notifTitle').value = title;
    document.getElementById('notifContent').value = content;
    document.getElementById('notifError').style.display = 'none';
    openModal('notifModal');
}

function closeNotifModal() {
    closeModal('notifModal');
}

async function submitNotification() {
    const title = document.getElementById('notifTitle').value.trim();
    const content = document.getElementById('notifContent').value.trim();
    const editingId = document.getElementById('editingNotifId').value;
    const errEl = document.getElementById('notifError');
    const btn = document.getElementById('notifSubmitBtn');

    errEl.style.display = 'none';
    if (!title || !content) {
        errEl.textContent = '제목과 내용을 모두 입력해주세요.';
        errEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = editingId ? '저장 중...' : '게시 중...';
    try {
        if (editingId) {
            await api(`/api/admin/seasons/${currentSeasonId}/announcements/${editingId}`, {
                method: 'PUT',
                body: JSON.stringify({ title, content })
            });
            showToast('공지사항이 수정되었습니다', 'success');
        } else {
            await api(`/api/admin/seasons/${currentSeasonId}/announcements`, {
                method: 'POST',
                body: JSON.stringify({ title, content })
            });
            showToast('공지사항이 게시되었습니다', 'success');
        }
        closeNotifModal();
        await loadAnnouncements();
    } catch(e) {
        errEl.textContent = e.message || '오류가 발생했습니다.';
        errEl.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = editingId ? '저장' : '게시';
    }
}

// ==================== Delete ====================
async function deleteAnnouncement(notifId) {
    if (!confirm('이 공지사항을 삭제하시겠습니까? 모든 부원의 알림에서도 사라집니다.')) return;
    try {
        await api(`/api/admin/seasons/${currentSeasonId}/announcements/${notifId}`, { method: 'DELETE' });
        showToast('공지사항이 삭제되었습니다', 'success');
        await loadAnnouncements();
    } catch(e) {
        showToast('삭제에 실패했습니다', 'error');
    }
}

// ==================== Pin ====================
async function togglePin(notifId, currentlyPinned) {
    const pinned = !currentlyPinned;
    try {
        await api(`/api/admin/seasons/${currentSeasonId}/announcements/${notifId}/pin?pinned=${pinned}`, { method: 'PUT' });
        showToast(pinned ? '홈 화면에 고정되었습니다' : '고정이 해제되었습니다', 'success');
        await loadAnnouncements();
    } catch(e) {
        showToast('처리에 실패했습니다', 'error');
    }
}
</script>
</body>
</html>
