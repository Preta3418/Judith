<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 — JUDITH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="dash-shell">

    <nav class="dash-nav">
        <div class="dash-nav-inner">
            <a href="/" class="dash-logo">
                <img src="/images/logo-symbol-light.png" alt="JUDITH">
                <span class="dash-logo-text">JUDITH</span>
            </a>
            <div class="dash-nav-tabs" id="navTabs">
                <a href="/dashboard/index.html" class="dash-tab active">홈</a>
                <a href="/dashboard/announcements.html" class="dash-tab">공지사항</a>
                <a href="/dashboard/scripts.html" class="dash-tab">대본</a>
                <a href="/dashboard/schedule.html" class="dash-tab">일정</a>
                <a href="/dashboard/board-select.html" class="dash-tab">게시판</a>
            </div>
            <div class="dash-nav-right">
                <button class="dash-season-btn" id="seasonSelector"></button>
                <div class="dash-avatar" id="userAvatar">U</div>
                <span class="dash-user-name" id="userName"></span>
                <button class="dash-btn-logout" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </nav>

    <main class="dash-main" id="pageContainer">
        <div class="loading"><div class="spinner"></div></div>
    </main>

</div>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
<script>
async function loadPageContent() {
    const container = document.getElementById('pageContainer');
    const name = getCurrentUserName();
    const isClosed = currentSeason.status === 'CLOSED';
    const canEdit = currentSeason.myFullAccess && !isClosed;

    const dday = computeDDay(currentSeason.eventDate);
    const ddayHtml = dday !== null ? `
        <div class="dash-dday-panel">
            <span class="dash-dday-label">공연까지</span>
            <span class="dash-dday-value">${dday === 0 ? 'D-DAY' : dday > 0 ? 'D-' + dday : 'D+' + Math.abs(dday)}</span>
            <span class="dash-dday-date">${fmtDate(currentSeason.eventDate)}</span>
        </div>
    ` : '';

    const todayLabel = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

    container.innerHTML = `
        <div class="dash-page-header">
            <div class="dash-greeting">${escHtml(name)}님, 안녕하세요 👋</div>
            <div class="dash-subtitle">${escHtml(currentSeason.seasonName)}</div>
        </div>

        ${ddayHtml}

        <!-- 최근 공지 -->
        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">최근 공지</span>
                <a href="${dashboardUrl('announcements.html')}" style="font-size:0.8rem;color:var(--primary);">전체 보기</a>
            </div>
            <div id="latestNotice"><div class="spinner" style="width:20px;height:20px;"></div></div>
        </div>

        <!-- 할 일 -->
        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">할 일</span>
                ${canEdit ? `<button class="btn btn-sm btn-outline" onclick="goToScheduleAdd()">+ 추가</button>` : ''}
            </div>
            <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:12px;">${todayLabel}</div>
            <div id="todayTodos"><div class="spinner" style="width:20px;height:20px;"></div></div>
        </div>

        <!-- 공유 파일 — pinned board attachments across all departments -->
        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">공유 파일</span>
                <a href="${dashboardUrl('board-select.html')}" style="font-size:0.8rem;color:var(--primary);">게시판으로</a>
            </div>
            <div id="pinnedFiles"><div class="spinner" style="width:20px;height:20px;"></div></div>
        </div>

        <div class="dash-stats">
            <a href="${dashboardUrl('announcements.html')}" class="dash-stat">
                <div class="dash-stat-value" id="statUnread">-</div>
                <div class="dash-stat-label">읽지 않은 공지</div>
            </a>
            <a href="${dashboardUrl('scripts.html')}" class="dash-stat">
                <div class="dash-stat-value" id="statScripts">-</div>
                <div class="dash-stat-label">대본 파일</div>
            </a>
            <div class="dash-stat">
                <div class="dash-stat-value" id="statMembers">-</div>
                <div class="dash-stat-label">시즌 부원</div>
            </div>
        </div>

        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">시즌 정보</span>
                ${statusBadge(currentSeason.status)}
            </div>
            <div class="dash-season-header">
                <span class="dash-season-name">${escHtml(currentSeason.seasonName)}</span>
            </div>
            <div class="dash-info-grid">
                <div class="dash-info-item">
                    <span class="dash-info-label">시작일</span>
                    <span class="dash-info-value">${fmtDate(currentSeason.startDate)}</span>
                </div>
                <div class="dash-info-item">
                    <span class="dash-info-label">공연일</span>
                    <span class="dash-info-value">${fmtDate(currentSeason.eventDate)}</span>
                </div>
                <div class="dash-info-item">
                    <span class="dash-info-label">종료일</span>
                    <span class="dash-info-value">${fmtDate(currentSeason.endDate)}</span>
                </div>
            </div>
        </div>

        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">내 역할</span>
            </div>
            <div class="dash-roles">
                ${(currentSeason.myRoles && currentSeason.myRoles.length > 0)
                    ? [...currentSeason.myRoles].map(r => `<span class="badge badge-primary">${escHtml(getRoleLabel(r))}</span>`).join('')
                    : '<span class="text-muted" style="font-size:0.875rem;">배정된 역할이 없습니다</span>'
                }
            </div>
        </div>

        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-card-title">부원 목록</span>
            </div>
            <div class="dash-member-grid" id="memberGrid">
                <div class="spinner"></div>
            </div>
        </div>
    `;

    loadLatestNotice();
    loadTodayTodos(canEdit);
    loadPinnedFiles();
    loadUnreadCount();
    loadScriptCount();
    loadMembers();
}

// 공유 파일 — fetches pinned attachments from all 4 department boards and merges them
async function loadPinnedFiles() {
    const el = document.getElementById('pinnedFiles');
    if (!el) return;
    try {
        const results = await Promise.all(BOARD_DEPARTMENTS.map(d =>
            api(`${boardApiBase(d.key)}/pinned-attachments`)
                .then(list => (list || []).map(a => ({ dept: d, att: a })))
                .catch(() => [])
        ));
        const pinned = results.flat();

        if (pinned.length === 0) {
            el.innerHTML = '<p style="font-size:0.85rem;color:var(--text-muted);">고정된 파일이 없습니다. 게시판에서 파일을 핀 고정하면 여기에 표시됩니다.</p>';
            return;
        }

        el.innerHTML = pinned.map(({ dept, att }) => {
            const label = att.fileName || att.linkUrl || '(첨부)';
            const source = att.source === 'COMMENT' ? 'comment' : 'post';
            const isImage = att.contentType === 'FILE' && isImageFile(att.fileName);

            // Photo pins: bigger thumbnail on the left, click to view full
            const leftCell = isImage && att.fileUrl
                ? `<img src="${escHtml(att.fileUrl)}" alt="preview"
                        style="width:48px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;flex-shrink:0;"
                        onclick="window.open('${escHtml(att.fileUrl)}', '_blank')"
                        onerror="this.outerHTML='<span style=\\'font-size:1.2rem;flex-shrink:0;\\'>${dept.icon}</span>'">`
                : `<span style="font-size:1.2rem;flex-shrink:0;">${dept.icon}</span>`;

            let action;
            if (att.contentType === 'URL') {
                action = `<a href="${escHtml(att.linkUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="font-size:0.72rem;flex-shrink:0;">열기</a>`;
            } else {
                action = `<button class="btn btn-secondary btn-sm" style="font-size:0.72rem;flex-shrink:0;" onclick="boardDownload('${dept.key}', '${source}', ${att.id}, ${JSON.stringify(label).replace(/"/g,'&quot;')})">다운로드</button>`;
            }
            return `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light);">
                ${leftCell}
                <div style="min-width:0;flex:1;">
                    <div style="font-size:0.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(label)}">${escHtml(label)}</div>
                    <div style="font-size:0.72rem;color:var(--text-muted);">${dept.label}${att.fileSize ? ' · ' + fmtBytes(att.fileSize) : ''}</div>
                </div>
                ${att.contentType === 'AUDIO' && att.fileUrl ? `<audio controls style="height:28px;max-width:180px;" src="${escHtml(att.fileUrl)}"></audio>` : action}
            </div>`;
        }).join('');
    } catch (e) {
        el.innerHTML = '<p style="font-size:0.85rem;color:var(--text-muted);">공유 파일을 불러올 수 없습니다.</p>';
    }
}

function computeDDay(eventDate) {
    if (!eventDate) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(eventDate); target.setHours(0,0,0,0);
    return Math.floor((target - today) / (1000 * 60 * 60 * 24));
}

async function loadLatestNotice() {
    const el = document.getElementById('latestNotice');
    try {
        const items = await api(`/api/dashboard/seasons/${currentSeasonId}/announcements`) || [];
        if (items.length === 0) {
            el.innerHTML = '<p style="font-size:0.875rem;color:var(--text-muted);">등록된 공지사항이 없습니다.</p>';
            return;
        }
        const n = items[0];
        const isUnread = !n.read;
        const isPinned = n.isPinned || n.pinned || false;
        el.innerHTML = `
            <a href="${dashboardUrl('announcements.html')}" style="text-decoration:none;color:inherit;display:block;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                    ${isUnread ? `<span style="width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;"></span>` : ''}
                    ${isPinned ? `<span style="font-size:0.7rem;background:var(--primary-bg);color:var(--primary);padding:1px 5px;border-radius:4px;font-weight:600;flex-shrink:0;">📌 고정</span>` : ''}
                    <span style="font-weight:${isUnread ? '600' : '500'};font-size:0.95rem;">${escHtml(n.title)}</span>
                </div>
                ${n.content ? `<div style="font-size:0.875rem;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap;word-break:break-word;">${escHtml(n.content)}</div>` : ''}
                <div style="font-size:0.75rem;color:var(--text-muted);margin-top:10px;">${fmtDate(n.createdAt)}</div>
            </a>
        `;
    } catch(e) {
        el.innerHTML = '<p style="font-size:0.875rem;color:var(--text-muted);">공지사항을 불러올 수 없습니다.</p>';
    }
}

async function loadTodayTodos(canEdit) {
    const el = document.getElementById('todayTodos');
    try {
        const today = new Date().toISOString().split('T')[0];
        const events = await calendarApi.getEvents(today, today);
        if (!events || events.length === 0) {
            el.innerHTML = '<p style="font-size:0.875rem;color:var(--text-muted);">오늘 일정이 없습니다.</p>';
            return;
        }
        el.innerHTML = events.map(e => `
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-light);" class="todo-item">
                <div style="min-width:0;">
                    <div style="font-size:0.9rem;font-weight:500;">${escHtml(e.title)}</div>
                    <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px;">${fmtDateTime(e.start)}</div>
                </div>
                ${canEdit ? `<button class="btn btn-ghost btn-sm" style="color:#ef4444;flex-shrink:0;font-size:0.8rem;" onclick="deleteTodo('${escHtml(e.googleEventId)}')">삭제</button>` : ''}
            </div>
        `).join('');
    } catch(e) {
        el.innerHTML = '<p style="font-size:0.875rem;color:var(--text-muted);">일정을 불러올 수 없습니다.</p>';
    }
}

async function deleteTodo(googleEventId) {
    if (!confirm('이 일정을 삭제하시겠습니까?')) return;
    try {
        await calendarApi.deleteEvent(googleEventId);
        showToast('삭제되었습니다.', 'success');
        loadTodayTodos(true);
    } catch(e) {
        showToast('삭제에 실패했습니다.', 'error');
    }
}

async function loadUnreadCount() {
    try {
        const items = await api(`/api/dashboard/seasons/${currentSeasonId}/announcements`) || [];
        const el = document.getElementById('statUnread');
        if (el) el.textContent = items.filter(n => !n.read).length;
    } catch(e) {
        const el = document.getElementById('statUnread');
        if (el) el.textContent = '0';
    }
}

async function loadScriptCount() {
    try {
        const scripts = await api(`/api/dashboard/seasons/${currentSeasonId}/scripts`);
        const el = document.getElementById('statScripts');
        if (el) el.textContent = scripts ? scripts.length : 0;
    } catch(e) {
        const el = document.getElementById('statScripts');
        if (el) el.textContent = '0';
    }
}

async function loadMembers() {
    const grid = document.getElementById('memberGrid');
    try {
        const members = await api(`/api/public/seasons/${currentSeasonId}/users`) || [];
        const el = document.getElementById('statMembers');
        if (el) el.textContent = members.length;

        if (members.length === 0) {
            grid.innerHTML = '<p style="color:var(--text-muted);font-size:0.875rem;">부원이 없습니다.</p>';
            return;
        }

        grid.innerHTML = members.map(m => `
            <div class="dash-member">
                <div class="dash-member-name">${escHtml(m.userName)}</div>
                <div class="dash-member-role">${escHtml(formatRoles(m.roles ? [...m.roles] : []))}</div>
            </div>
        `).join('');
    } catch(e) {
        if (grid) grid.innerHTML = '<p style="color:var(--text-muted);font-size:0.875rem;">부원 목록을 불러올 수 없습니다.</p>';
    }
}

function goToScheduleAdd() {
    window.location.href = dashboardUrl('schedule.html') + '&add=1';
}
</script>
</body>
</html>
